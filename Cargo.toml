[package]
name = "pi-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_16"] }
gdk4 = { version = "0.11", features = ["v4_16"] }
pango = "0.22"
libadwaita = { version = "0.9", features = ["v1_4"] }
glib = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = 3
lto = true
